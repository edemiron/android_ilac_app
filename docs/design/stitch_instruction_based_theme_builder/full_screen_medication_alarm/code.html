<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Incoming Medication Alarm</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#89f5e7",
                        "missed-bg": "#FEE2E2",
                        "surface-dim": "#cbdbf5",
                        "secondary-fixed-dim": "#ffb2b7",
                        "tertiary-fixed": "#ffdbce",
                        "on-primary-fixed-variant": "#005049",
                        "surface": "#f8f9ff",
                        "primary-fixed-dim": "#6bd8cb",
                        "taken": "#10B981",
                        "on-secondary-container": "#fffbff",
                        "on-primary-fixed": "#00201d",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#bcc9c6",
                        "tertiary": "#924628",
                        "inverse-surface": "#213145",
                        "missed": "#EF4444",
                        "secondary": "#b90538",
                        "background": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "outline": "#6d7a77",
                        "on-primary": "#ffffff",
                        "bg-dark": "#0F172A",
                        "on-surface": "#0b1c30",
                        "on-primary-container": "#f4fffc",
                        "on-tertiary-container": "#fffbff",
                        "inverse-on-surface": "#eaf1ff",
                        "error": "#ba1a1a",
                        "on-background": "#0b1c30",
                        "taken-bg": "#D1FAE5",
                        "surface-container-highest": "#d3e4fe",
                        "surface-tint": "#006a61",
                        "on-surface-variant": "#3d4947",
                        "skipped-bg": "#FEF3C7",
                        "on-secondary-fixed": "#40000d",
                        "surface-bright": "#f8f9ff",
                        "primary-container": "#008378",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#6bd8cb",
                        "secondary-container": "#dc2c4f",
                        "on-tertiary-fixed-variant": "#773215",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#92002a",
                        "primary": "#00685f",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#ffdadb",
                        "skipped": "#F59E0B",
                        "on-tertiary-fixed": "#370e00",
                        "tertiary-fixed-dim": "#ffb59a",
                        "surface-dark": "#1E293B",
                        "surface-container": "#e5eeff",
                        "tertiary-container": "#b05e3d",
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "margin-mobile": "16px",
                        "touch-target": "48px",
                        "card-padding": "16px",
                        "gutter": "12px",
                        "margin-desktop": "24px"
                    },
                    "fontFamily": {
                        "headline-screen": ["Plus Jakarta Sans"],
                        "time-display": ["Inter"],
                        "body-lg-med": ["Inter"],
                        "body-regular": ["Inter"],
                        "label-badge": ["Inter"],
                        "display-hero": ["Plus Jakarta Sans"],
                        "headline-card": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-screen": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "time-display": ["30px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-lg-med": ["16px", { "lineHeight": "22px", "fontWeight": "600" }],
                        "body-regular": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-badge": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "display-hero": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-card": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 104, 95, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(0, 104, 95, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 104, 95, 0); }
        }
        .glow-button {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            transition: all 0.3s ease;
        }
        .glow-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
        }
    </style>
</head>
<body class="bg-primary h-screen w-screen overflow-hidden flex flex-col justify-between items-center px-margin-mobile py-8 relative">
<!-- Ambient Background Pattern -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at 50% 50%, #ffffff 2px, transparent 2px); background-size: 32px 32px;"></div>
<!-- Header / Alarm Status -->
<div class="w-full text-center z-10 pt-8">
<h1 class="font-display-hero text-display-hero text-on-primary mb-2 animate-pulse">ALARM</h1>
<p class="font-time-display text-time-display text-on-primary">08:00 AM</p>
</div>
<!-- Medication Card -->
<div class="bg-surface-container-lowest w-full max-w-sm rounded-xl p-card-padding shadow-2xl z-10 transform transition-transform hover:scale-105 duration-300">
<div class="flex items-center gap-4 mb-6">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center pulse-ring">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    pill
                </span>
</div>
<div>
<h2 class="font-headline-card text-headline-card text-on-surface">Lisinopril 10mg</h2>
<p class="font-body-regular text-body-regular text-on-surface-variant">1 Tablet</p>
</div>
</div>
<div class="flex flex-col gap-4">
<button class="w-full bg-taken text-on-primary font-headline-card text-headline-card py-4 rounded-lg glow-button flex items-center justify-center gap-2 touch-target">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                İlacı Aldım
            </button>
<button class="w-full bg-surface-variant text-on-surface font-body-lg-med text-body-lg-med py-4 rounded-lg active:scale-95 transition-transform touch-target border border-outline-variant">
                Ertele
            </button>
</div>
</div>
<!-- Voice Control Badge -->
<div class="z-10 pb-8 w-full flex justify-center">
<div class="bg-inverse-surface/90 backdrop-blur-md rounded-full px-6 py-3 flex items-center gap-3 shadow-lg border border-outline-variant/30">
<div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center animate-pulse">
<span class="material-symbols-outlined text-on-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<p class="font-body-regular text-body-regular text-on-tertiary">
                Say <span class="font-bold text-primary-fixed">"Aldım"</span> to dismiss
            </p>
</div>
</div>
</body></html>
