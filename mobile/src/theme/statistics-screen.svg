    <text x="122" y="640" font-family="system-ui" font-size="9" fill="#94A3B8" text-anchor="middle">Çar</text>
    <text x="164" y="640" font-family="system-ui" font-size="9" fill="#94A3B8" text-anchor="middle">Per</text>
    <text x="206" y="640" font-family="system-ui" font-size="9" fill="#94A3B8" text-anchor="middle">Cum</text>
    <text x="248" y="640" font-family="system-ui" font-size="9" fill="#94A3B8" text-anchor="middle">Cte</text>
    <text x="290" y="640" font-family="system-ui" font-size="9" fill="#94A3B8" text-anchor="middle">Paz</text>
    <text x="332" y="640" font-family="system-ui" font-size="9" fill="#94A3B8" text-anchor="middle">Pzt</text>
