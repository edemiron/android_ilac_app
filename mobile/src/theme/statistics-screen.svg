  <rect x="0" y="776" width="390" height="68" fill="#FFFFFF" filter="url(#shadow3)"/>
  <line x1="0" y1="776" x2="390" y2="776" stroke="#E2E8F0" stroke-width="1"/>

  <text x="50" y="806" font-family="system-ui" font-size="18" fill="#94A3B8" text-anchor="middle">🏠</text>
  <text x="50" y="822" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Ana Sayfa</text>

  <text x="130" y="806" font-family="system-ui" font-size="18" fill="#94A3B8" text-anchor="middle">💊</text>
  <text x="130" y="822" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">İlaçlarım</text>

  <circle cx="195" cy="776" r="28" fill="url(#tabGrad)"/>
  <text x="195" y="782" font-family="system-ui" font-size="24" fill="#FFFFFF" text-anchor="middle">+</text>

  <!-- İstatistikler (Aktif) -->
  <rect x="230" y="786" width="60" height="4" rx="2" fill="#0D9488"/>
  <text x="260" y="806" font-family="system-ui" font-size="18" fill="#0D9488" text-anchor="middle">📊</text>
  <text x="260" y="822" font-family="system-ui" font-size="10" font-weight="600" fill="#0D9488" text-anchor="middle">İstatistikler</text>

  <text x="340" y="806" font-family="system-ui" font-size="18" fill="#94A3B8" text-anchor="middle">⚙️</text>
  <text x="340" y="822" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Ayarlar</text>
