    <!-- Alındı dilimi (%96) -->
    <circle cx="120" cy="750" r="50" fill="none" stroke="#0D9488" stroke-width="100" stroke-dasharray="302 16" stroke-dashoffset="0" transform="rotate(-90 120 750)"/>
    <!-- Atlandı dilimi (%4) -->
    <circle cx="120" cy="750" r="50" fill="none" stroke="#D97706" stroke-width="100" stroke-dasharray="12.6 305.4" stroke-dashoffset="-302" transform="rotate(-90 120 750)"/>
    <!-- İç beyaz daire -->
    <circle cx="120" cy="750" r="30" fill="#FFFFFF"/>

