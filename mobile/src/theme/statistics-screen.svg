    <text x="232" y="739" font-family="system-ui" font-size="12" fill="#0F172A">148 Alındı</text>
    <circle cx="220" cy="758" r="5" fill="#D97706"/>
    <text x="232" y="762" font-family="system-ui" font-size="12" fill="#0F172A">6 Atlandı</text>
  </g>

