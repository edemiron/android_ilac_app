<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="adherenceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
    <filter id="shadow3" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC"/>

  <!-- Status Bar -->
  <text x="32" y="32" font-family="system-ui" font-size="14" font-weight="600" fill="#0F172A">6:15</text>

  <!-- Sayfa Başlığı -->
  <text x="24" y="76" font-family="system-ui" font-size="24" font-weight="700" fill="#0F172A">İstatistikler</text>

  <!-- Uyum Kartı (Gradient) -->
  <g filter="url(#shadow3)">
    <rect x="16" y="92" width="358" height="80" rx="16" fill="url(#adherenceGrad)"/>
    <!-- Yıldız ikonu -->
    <circle cx="44" cy="132" r="18" fill="rgba(255,255,255,0.2)"/>
    <text x="44" y="138" font-family="system-ui" font-size="18" text-anchor="middle">⭐</text>
    <!-- Metin -->
    <text x="72" y="120" font-family="system-ui" font-size="14" font-weight="600" fill="#FFFFFF">148/154 tamamlandı</text>
    <text x="72" y="140" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.8)">Harika gidiyorsun! 🎉</text>
    <!-- Yüzde -->
    <text x="340" y="136" font-family="system-ui" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">%96</text>
  </g>

  <!-- PDF Rapor Butonu -->
  <rect x="16" y="184" width="358" height="42" rx="12" fill="#0F172A"/>
  <text x="195" y="210" font-family="system-ui" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">📄 PDF Rapor Oluştur</text>

  <!-- Dönem Seçimi -->
  <text x="24" y="252" font-family="system-ui" font-size="13" font-weight="700" fill="#475569">📅 DÖNEM SEÇİMİ</text>
  <g>
    <rect x="16" y="262" width="175" height="36" rx="10" fill="#0D9488"/>
    <text x="103" y="284" font-family="system-ui" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">📋 Haftalık</text>
