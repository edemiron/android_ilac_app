    <line x1="60" y1="576" x2="350" y2="576" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="60" y1="601" x2="350" y2="601" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="60" y1="626" x2="350" y2="626" stroke="#F1F5F9" stroke-width="1"/>

