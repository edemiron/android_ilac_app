    <text x="32" y="336" font-family="system-ui" font-size="13" font-weight="700" fill="#475569">📊 ÖZET</text>

    <!-- Alındı -->
    <rect x="32" y="348" width="326" height="28" rx="6" fill="#F8FAFC"/>
    <rect x="40" y="354" width="16" height="16" rx="4" fill="#059669"/>
    <text x="40" y="366" font-family="system-ui" font-size="10" fill="#FFFFFF" text-anchor="middle">✓</text>
