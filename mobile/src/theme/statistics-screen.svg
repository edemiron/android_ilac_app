    <circle cx="122" cy="526" r="4" fill="#0D9488"/>
    <circle cx="164" cy="530" r="4" fill="#0D9488"/>
    <circle cx="206" cy="526" r="4" fill="#0D9488"/>
    <circle cx="248" cy="526" r="4" fill="#0D9488"/>
    <circle cx="290" cy="528" r="4" fill="#0D9488"/>
    <circle cx="332" cy="526" r="4" fill="#0D9488"/>

