    <clipPath id="screenClip">
      <rect width="390" height="844" rx="40"/>
    </clipPath>
  </defs>

  <!-- Telefon Çerçevesi -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC" clip-path="url(#screenClip)"/>

