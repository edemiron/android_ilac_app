  <!-- Sayfa Başlığı -->
  <text x="24" y="76" font-family="system-ui" font-size="24" font-weight="700" fill="#0F172A">İlaçlarım</text>

  <!-- Arama Çubuğu -->
  <rect x="16" y="92" width="358" height="44" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
