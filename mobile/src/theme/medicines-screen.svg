  <text x="50" y="822" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Ana Sayfa</text>

  <!-- Tab: İlaçlarım (Aktif) -->
  <rect x="100" y="786" width="60" height="4" rx="2" fill="#0D9488"/>
  <text x="130" y="806" font-family="system-ui" font-size="18" fill="#0D9488" text-anchor="middle">💊</text>
  <text x="130" y="822" font-family="system-ui" font-size="10" font-weight="600" fill="#0D9488" text-anchor="middle">İlaçlarım</text>

  <!-- FAB -->
  <circle cx="195" cy="776" r="28" fill="url(#headerGrad2)"/>
  <text x="195" y="782" font-family="system-ui" font-size="24" fill="#FFFFFF" text-anchor="middle">+</text>

  <!-- Tab: İstatistikler -->
  <text x="260" y="806" font-family="system-ui" font-size="18" fill="#94A3B8" text-anchor="middle">📊</text>
  <text x="260" y="822" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">İstatistikler</text>

  <!-- Tab: Ayarlar -->
  <text x="340" y="806" font-family="system-ui" font-size="18" fill="#94A3B8" text-anchor="middle">⚙️</text>
  <text x="340" y="822" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Ayarlar</text>
