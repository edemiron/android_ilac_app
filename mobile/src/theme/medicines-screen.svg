    <text x="56" y="230" font-family="system-ui" font-size="22" text-anchor="middle">⭐</text>
    <!-- İlaç bilgileri -->
    <text x="92" y="212" font-family="system-ui" font-size="15" font-weight="700" fill="#0F172A">TEST-Gripin</text>
    <text x="92" y="230" font-family="system-ui" font-size="12" fill="#475569">250mg · günde 1 kez · Herhangi bir zaman</text>
    <!-- Sonraki hatırlatma -->
