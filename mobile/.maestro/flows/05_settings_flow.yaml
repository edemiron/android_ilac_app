appId: com.ilachatirlatici
name: "05 - Settings Flow Test"
---
# İlaç Hatırlatıcı - Ayarlar Testi

- launchApp:
    appId: com.ilachatirlatici

# Ayarlar ekranına git
- tapOn:
    text: "Ayarlar"
    timeout: 10000

# Ayarlar ekranını doğrula
- assertVisible:
    text: "Görünüm"
    timeout: 5000

# Tema değiştir
- tapOn:
    text: "Tema"

- assertVisible:
    text: "Koyu"
    timeout: 3000

- tapOn:
    text: "Koyu"

# Tema değiştiğini doğrula
- takeScreenshot: "05_dark_theme"

# Tekrar açık temaya dön
- tapOn:
    text: "Tema"

- tapOn:
    text: "Açık"

# Dil ayarı
- tapOn:
    text: "Dil"
    optional: true

- assertVisible:
    text: "English"
    optional: true
    timeout: 3000

# Türkçe'de kal
- tapOn:
    text: "Türkçe"
    optional: true

# Bildirim ayarları
- scrollUntilVisible:
    element:
      text: "Bildirimler"
    direction: DOWN

- assertVisible:
    text: "Bildirimler"

# Titreşim toggle
- tapOn:
    text: "Titreşim"
    optional: true

- takeScreenshot: "05_settings_completed"
