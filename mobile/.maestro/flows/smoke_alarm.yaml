# .maestro/flows/smoke_alarm.yaml
# Maestro E2E flow — Sprint 95 alarm fix doğrulaması.
#
# Kullanım (CI veya yerel):
#   maestro test .maestro/flows/smoke_alarm.yaml
#
# Ön koşul: Firebase Console'da test kullanıcısı (test@example.com / Test1234!)
# oluşturulmuş olmalı ve Email/Password Sign-In method etkin olmalı.
#
# Bu flow:
# 1. Uygulamayı cold start eder
# 2. Login ekranını email/password ile doldurur
# 3. Ana sayfaya geçer, ilaç ekler
# 4. trigger-boot.sh (adb am broadcast) ile BootReceiver tetikler
# 5. smokeTriggerTime'a sahip ilaç için alarmın fires olmasını bekler
# 6. "İlaç Zamanı" modalını doğrular

appId: com.ilachatirlatici
---

- launchApp:
    clearState: true
    clearKeychain: true

# Login ekranı yüklenene dek bekle
- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

# Email + Password
- tapOn:
    id: "email-input"
    optional: true          # id yoksa bounds fallback
- inputText: "dorianbinding@web-library.net"
- tapOn:
    id: "password-input"
    optional: true
- inputText: "Test1234!"
- tapOn: "Login"

# Home / Onboarding geçişi
- extendedWaitUntil:
    visible: "İlaçlarım"
    timeout: 30000

# Permission dialogs (İzin Ver / Allow)
- tapOn:
    text: "İzin Ver"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Settings"
    optional: true

# Home ekranına dön (gerekirse back)
- back
- extendedWaitUntil:
    visible: "İlaçlarım"

# İlaç ekleme akışı
- tapOn: "+"
- tapOn:
    id: "medicine-name-input"
    optional: true
- inputText: "SmokeTest"
- tapOn: "Kaydet"

# Alarm pipeline smoke — bypassBuffer=false yolu için seedSmoke seed'i
# UI flow bypassBuffer=true olduğu için bu flow sadece UI doğrulama yapar.
# Gerçek BootReceiver yolu için bkz: bash mobile/scripts/trigger-boot.sh
# Yol DUZELTILDI: flow'lar mobile/.maestro/flows/ altina tasindiginda
# '../mobile/scripts/...' → 'mobile/.maestro/mobile/scripts/...' oluyordu.
# optional: true oldugu icin bu adim SESSIZCE atlaniyordu, yani BootReceiver
# yolu hic tetiklenmiyordu.
- runScript:
    path: ../../scripts/trigger-boot.sh
    optional: true

# Ana ekrana dön + screenshot
- back
- takeScreenshot: /tmp/maestro-smoke-final.png
