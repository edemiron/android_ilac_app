# Maestro E2E Test Configuration
# https://maestro.mobile.dev/

appId: com.ilachatirlatici
name: "İlaç Hatırlatıcı E2E Tests"

# Test execution settings
flows:
  - flows/

# Default timeout for assertions (ms)
timeout: 30000

# Screenshot output directory
screenshots:
  directory: ./screenshots

# Test filtering (optional)
# include:
#   - "01_*"
#   - "02_*"

# Environment variables
env:
  TEST_USER: "test@example.com"
  TEST_PASS: "test123"
