name: CI

on:
  push:
    paths:
      - 'mobile/**'
      - 'firestore.rules'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'firestore.rules'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# En dusuk yetki: sadece repo okuma. PR'lardan gelen fork'larda
# secret'lara yazma izni vermiyoruz.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mobile:
    name: Validate mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: mobile_lint
        shell: bash
        run: |
          start=$(date +%s)
          if npm run lint; then
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
          else
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run typecheck
        id: mobile_typecheck
        shell: bash
        run: |
          start=$(date +%s)
          if npm run typecheck; then
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
          else
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run settings regression pack
        id: mobile_settings
        shell: bash
        run: |
          start=$(date +%s)
          if npm run test:settings; then
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
          else
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run caregiver regression pack
        id: mobile_caregiver
        shell: bash
        run: |
          start=$(date +%s)
          if npm run test:caregiver; then
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
          else
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run critical tests
        id: mobile_critical
        shell: bash
        run: |
          start=$(date +%s)
          if npm run test:critical; then
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
          else
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run full test suite with coverage gate
        id: mobile_coverage
        shell: bash
        run: |
          start=$(date +%s)
          # coverageThreshold jest.config.js icinde tanimli; asan testler fail eder.
          # CI'da coverage raporunu artifact olarak da yukluyoruz ki PR inceleme
          # yapabilsin.
          if npm run test:coverage; then
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
          else
            end=$(date +%s)
            echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-${{ github.run_id }}
          path: mobile/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish mobile validation summary
        if: always()
        shell: bash
        run: |
          lint_seconds="${{ steps.mobile_lint.outputs.duration_seconds }}"
          typecheck_seconds="${{ steps.mobile_typecheck.outputs.duration_seconds }}"
          settings_seconds="${{ steps.mobile_settings.outputs.duration_seconds }}"
          caregiver_seconds="${{ steps.mobile_caregiver.outputs.duration_seconds }}"
          critical_seconds="${{ steps.mobile_critical.outputs.duration_seconds }}"
          coverage_seconds="${{ steps.mobile_coverage.outputs.duration_seconds }}"

          total_seconds=0
          for value in "$lint_seconds" "$typecheck_seconds" "$settings_seconds" "$caregiver_seconds" "$critical_seconds" "$coverage_seconds"; do
            if [[ "$value" =~ ^[0-9]+$ ]]; then
              total_seconds=$((total_seconds + value))
            fi
          done

          format_duration() {
            local value="$1"
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "n/a"
              return
            fi

            local minutes=$((value / 60))
            local seconds=$((value % 60))
            printf "%dm %02ds" "$minutes" "$seconds"
          }

          {
            echo "## Mobile Validation Summary"
            echo
            echo "| Check | Result | Duration |"
            echo "| --- | --- | --- |"
            echo "| ESLint | ${{ steps.mobile_lint.outcome }} | $(format_duration "$lint_seconds") |"
            echo "| Typecheck | ${{ steps.mobile_typecheck.outcome }} | $(format_duration "$typecheck_seconds") |"
            echo "| Settings regression pack | ${{ steps.mobile_settings.outcome }} | $(format_duration "$settings_seconds") |"
            echo "| Caregiver regression pack | ${{ steps.mobile_caregiver.outcome }} | $(format_duration "$caregiver_seconds") |"
            echo "| Critical tests | ${{ steps.mobile_critical.outcome }} | $(format_duration "$critical_seconds") |"
            echo "| Coverage gate | ${{ steps.mobile_coverage.outcome }} | $(format_duration "$coverage_seconds") |"
            echo
            echo "**Total measured duration:** $(format_duration "$total_seconds")"
            echo
            echo "### Follow-up Notes / Sonraki Kontroller"

            if [[ "${{ steps.mobile_lint.outcome }}" == "failure" ]]; then
              echo "- ESLint failed / ESLint hatasi: first check formatting, unused imports, and rule details in the step log."
            fi

            if [[ "${{ steps.mobile_typecheck.outcome }}" == "failure" ]]; then
              echo "- Typecheck failed / Typecheck hatasi: start with recent TS prop-type changes, especially navigation params and test mocks."
            fi

            if [[ "${{ steps.mobile_settings.outcome }}" == "failure" ]]; then
              echo "- Settings regression pack failed / Ayarlar paketi hatasi: review persistence, boot restore, notification, and security changes first."
            fi

            if [[ "${{ steps.mobile_caregiver.outcome }}" == "failure" ]]; then
              echo "- Caregiver regression pack failed / Bakici paketi hatasi: review invite share helpers, CaregiverScreen actions, and caregiver notification mocks."
            fi

            if [[ "${{ steps.mobile_critical.outcome }}" == "failure" ]]; then
              echo "- Critical tests failed / Kritik test hatasi: inspect barcode flow, add-medicine flow, and core medicine utility changes."
            fi

            if [[ "${{ steps.mobile_coverage.outcome }}" == "failure" ]]; then
              echo "- Coverage gate failed / Coverage esigi altinda: jest.config.js'deki threshold degerlerinin altinda. Yeni testler ekleyin veya mevcut testlerin kapsamini arttirin."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
