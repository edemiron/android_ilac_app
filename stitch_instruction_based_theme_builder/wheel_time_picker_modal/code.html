<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Time Picker Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed": "#89f5e7",
                      "missed-bg": "#FEE2E2",
                      "surface-dim": "#cbdbf5",
                      "secondary-fixed-dim": "#ffb2b7",
                      "tertiary-fixed": "#ffdbce",
                      "on-primary-fixed-variant": "#005049",
                      "surface": "#f8f9ff",
                      "primary-fixed-dim": "#6bd8cb",
                      "taken": "#10B981",
                      "on-secondary-container": "#fffbff",
                      "on-primary-fixed": "#00201d",
                      "on-tertiary": "#ffffff",
                      "outline-variant": "#bcc9c6",
                      "tertiary": "#924628",
                      "inverse-surface": "#213145",
                      "missed": "#EF4444",
                      "secondary": "#b90538",
                      "background": "#f8f9ff",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-high": "#dce9ff",
                      "outline": "#6d7a77",
                      "on-primary": "#ffffff",
                      "bg-dark": "#0F172A",
                      "on-surface": "#0b1c30",
                      "on-primary-container": "#f4fffc",
                      "on-tertiary-container": "#fffbff",
                      "inverse-on-surface": "#eaf1ff",
                      "error": "#ba1a1a",
                      "on-background": "#0b1c30",
                      "taken-bg": "#D1FAE5",
                      "surface-container-highest": "#d3e4fe",
                      "surface-tint": "#006a61",
                      "on-surface-variant": "#3d4947",
                      "skipped-bg": "#FEF3C7",
                      "on-secondary-fixed": "#40000d",
                      "surface-bright": "#f8f9ff",
                      "primary-container": "#008378",
                      "on-error-container": "#93000a",
                      "inverse-primary": "#6bd8cb",
                      "secondary-container": "#dc2c4f",
                      "on-tertiary-fixed-variant": "#773215",
                      "error-container": "#ffdad6",
                      "on-secondary-fixed-variant": "#92002a",
                      "primary": "#00685f",
                      "surface-variant": "#d3e4fe",
                      "secondary-fixed": "#ffdadb",
                      "skipped": "#F59E0B",
                      "on-tertiary-fixed": "#370e00",
                      "tertiary-fixed-dim": "#ffb59a",
                      "surface-dark": "#1E293B",
                      "surface-container": "#e5eeff",
                      "tertiary-container": "#b05e3d",
                      "on-error": "#ffffff",
                      "surface-container-low": "#eff4ff",
                      "on-secondary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "4px",
                      "margin-mobile": "16px",
                      "touch-target": "48px",
                      "card-padding": "16px",
                      "gutter": "12px",
                      "margin-desktop": "24px"
              },
              "fontFamily": {
                      "headline-screen": [
                              "Plus Jakarta Sans"
                      ],
                      "time-display": [
                              "Inter"
                      ],
                      "body-lg-med": [
                              "Inter"
                      ],
                      "body-regular": [
                              "Inter"
                      ],
                      "label-badge": [
                              "Inter"
                      ],
                      "display-hero": [
                              "Plus Jakarta Sans"
                      ],
                      "headline-card": [
                              "Plus Jakarta Sans"
                      ]
              },
              "fontSize": {
                      "headline-screen": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "700"
                              }
                      ],
                      "time-display": [
                              "30px",
                              {
                                      "lineHeight": "36px",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-lg-med": [
                              "16px",
                              {
                                      "lineHeight": "22px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-regular": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-badge": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "fontWeight": "500"
                              }
                      ],
                      "display-hero": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-card": [
                              "18px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "600"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .wheel-container {
            mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-regular min-h-screen flex items-end justify-center sm:items-center">
<!-- Backdrop Blur overlay to keep user focused on time-sensitive task -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-[10px] z-40"></div>
<!-- Bottom Sheet Modal -->
<div class="w-full sm:max-w-md bg-surface-container-lowest rounded-t-[24px] sm:rounded-[24px] shadow-lg z-50 overflow-hidden transform transition-transform duration-300">
<!-- Drag Handle for Mobile -->
<div class="w-full flex justify-center pt-3 pb-1 sm:hidden">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-margin-mobile py-4 border-b border-surface-variant">
<button class="h-touch-target px-2 flex items-center justify-center text-on-surface-variant font-body-lg-med text-body-lg-med hover:bg-surface-container-low rounded-lg transition-colors">
                İptal
            </button>
<h2 class="font-headline-card text-headline-card text-on-surface">Saat Seçin</h2>
<button class="h-touch-target px-2 flex items-center justify-center text-primary font-body-lg-med text-body-lg-med hover:bg-surface-container-low rounded-lg transition-colors">
                Tamam
            </button>
</div>
<!-- Time Picker Body -->
<div class="relative h-[240px] flex items-center justify-center bg-surface-container-lowest px-margin-mobile py-6">
<!-- Dual-Divider Wheel Lines (1.5px thickness, Primary Teal) -->
<div class="absolute inset-y-0 flex items-center justify-center w-full pointer-events-none">
<div class="w-3/4 max-w-[200px] h-[52px] border-y-[1.5px] border-primary"></div>
</div>
<!-- Columns Container -->
<div class="flex gap-12 wheel-container h-full overflow-hidden w-full max-w-[200px] justify-center relative z-10">
<!-- Hours Column -->
<div class="flex flex-col h-full overflow-y-scroll hide-scrollbar snap-y snap-mandatory scroll-smooth" id="hours-scroll">
<!-- Padding elements to allow centering -->
<div class="h-[94px] shrink-0"></div>
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface-variant/40 transition-colors duration-200">06</div>
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface-variant/40 transition-colors duration-200">07</div>
<!-- Selected Hour -->
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface transition-colors duration-200">08</div>
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface-variant/40 transition-colors duration-200">09</div>
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface-variant/40 transition-colors duration-200">10</div>
<!-- Padding elements -->
<div class="h-[94px] shrink-0"></div>
</div>
<!-- Colon Separator -->
<div class="flex items-center justify-center h-full font-time-display text-time-display text-on-surface pb-1">
                    :
                </div>
<!-- Minutes Column -->
<div class="flex flex-col h-full overflow-y-scroll hide-scrollbar snap-y snap-mandatory scroll-smooth" id="minutes-scroll">
<!-- Padding elements to allow centering -->
<div class="h-[94px] shrink-0"></div>
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface-variant/40 transition-colors duration-200">28</div>
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface-variant/40 transition-colors duration-200">29</div>
<!-- Selected Minute -->
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface transition-colors duration-200">30</div>
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface-variant/40 transition-colors duration-200">31</div>
<div class="snap-center h-[52px] flex items-center justify-center font-time-display text-time-display text-on-surface-variant/40 transition-colors duration-200">32</div>
<!-- Padding elements -->
<div class="h-[94px] shrink-0"></div>
</div>
</div>
</div>
<!-- Bottom padding for mobile safe area -->
<div class="h-6 w-full bg-surface-container-lowest"></div>
</div>
<script>
        // Simple script to center the selected items on load to demonstrate the selected state
        document.addEventListener('DOMContentLoaded', () => {
            const hoursScroll = document.getElementById('hours-scroll');
            const minutesScroll = document.getElementById('minutes-scroll');
            
            // Scroll to center the 3rd item (index 2 + padding)
            if(hoursScroll) hoursScroll.scrollTop = 52 * 2;
            if(minutesScroll) minutesScroll.scrollTop = 52 * 2;
        });
    </script>
</body></html>
